version: "2.4"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pern_postgres
    environment:
      POSTGRES_DB: pern_baseline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql

  backend:
    build:
      context: ./backend
      target: dev
    container_name: pern_backend
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pern_baseline
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173,http://localhost:5176
      FASTAPI_URL: http://fastapi:8001
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: pern_frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Future service: fastapi microservice (kept as optional extension point)
  # fastapi:
  #   build:
  #     context: ./services/fastapi
  #   ports:
  #     - "8001:8001"

volumes:
  postgres_data:
